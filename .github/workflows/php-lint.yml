name: PHP Syntax Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP files
        run: |
          find . \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0 | \
            xargs -0 -n1 php -l
